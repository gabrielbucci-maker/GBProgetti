<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contattami | Gabriel Bucci</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Contattami | Gabriel Bucci" />
  <meta property="og:description" content="Contatta Gabriel Bucci per collaborazioni e opportunità lavorative." />
  <meta property="og:image" content="https://Assets/image/prseview.png" />
  <meta property="og:url" content="https://gabrielbucci-maker.github.io/GBProgetti/Contatti.html" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contattami | Gabriel Bucci" />
  <meta name="twitter:description" content="Contatta Gabriel Bucci per collaborazioni e opportunità lavorative." />
  <meta name="twitter:image" content="https://tuosito.it/assets/preview.jpg" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="Assets/styles.css" />
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Gabriel Bucci</a>
    </div>
  </nav>

  <main class="container contact-page" style="padding-top: 100px; max-width: 700px;">
    <h1 class="mb-4">Contattami</h1>

    <p class="subtitle-erp">
      Se desideri metterti in contatto con me per opportunità lavorative o collaborazioni,
      compila il form sottostante.
    </p>

    <form id="contact-form" class="contact-form">

      <div class="mb-3">
        <label for="name" class="form-label">Nome</label>
        <input type="text" id="name" name="user_name" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="user_email" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Messaggio</label>
        <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
      </div>

      <!-- Honeypot anti-bot -->
      <input type="text" name="website" id="website" style="display:none">

      <button type="submit" class="btn btn-primary w-100">
        Invia messaggio
      </button>
    </form>

    <!-- Stato invio -->
    <p id="form-status" class="mt-3 fw-semibold"></p>

    <hr class="my-4" />

    <p class="subtitle-erp">
      Oppure puoi contattarmi tramite:
    </p>

    <ul>
      <!-- Meglio evitare di scrivere l'email direttamente per non attirare bot -->
      <li>
        LinkedIn:
        <a href="https://www.linkedin.com/in/gabriel-bucci-27ba69267" target="_blank">
          Gabriel Bucci
        </a>
      </li>
    </ul>
  </main>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    // Inizializza EmailJS
    emailjs.init("PUBLIC_KEY"); // <-- metti la tua Public Key

    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      // Honeypot: se il campo nascosto è compilato => bot
      if (document.getElementById("website").value !== "") {
        status.textContent = "Invio bloccato.";
        status.className = "text-danger mt-3 fw-semibold";
        return;
      }

      status.textContent = "Invio in corso...";
      status.className = "text-primary mt-3 fw-semibold";

      emailjs.sendForm("SERVICE_ID", "TEMPLATE_ID", this)
        .then(() => {
          status.textContent = "Messaggio inviato correttamente!";
          status.className = "text-success mt-3 fw-semibold";
          form.reset();
        })
        .catch((error) => {
          status.textContent = "Errore durante l'invio. Riprova più tardi.";
          status.className = "text-danger mt-3 fw-semibold";
          console.error("EmailJS error:", error);
        });
    });
  </script>

</body>
</html>
